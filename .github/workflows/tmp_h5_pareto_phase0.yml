name: Temporary H5 Pareto Phase 0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp_h5_pareto_phase0.yml"
      - "tools/tmp_h5_phase0.py"
      - "binder/postBuild"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  H5_DRIVE_FILE_ID: 1iDyNtvi9FF8ACMHaNb_bnlkrvW1NVIly
  H5_INPUT_NAME: H5_GPT_PRO_HANDOFF_2026-09-03_094836WIB.zip
  H5_RUN_EPOCH: "2026-09-03T10:45:00+07:00"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect H5 handoff
        run: python tools/tmp_h5_phase0.py
      - name: Upload phase-0 reconstruction
        uses: actions/upload-artifact@v4
        with:
          name: h5-pareto-phase0
          path: .tmp-h5-pareto/output
          if-no-files-found: error
          retention-days: 3
